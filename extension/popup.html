<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ABD Wallet</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 420px;
      height: 600px;
      overflow: hidden;
      background: #E4E3E8; /* Matching the wallet's neumorphic background */
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    /* Loading state placeholder */
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: #8C9BAB;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 1;
    }
    
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #CAD2DF;
      border-top-color: #56637B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    iframe {
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    Starting Local Engine...
  </div>

  <iframe src="http://localhost:3000" id="wallet-frame" allow="clipboard-write"></iframe>

  <script src="popup_wrapper.js"></script>

</body>
</html>
